<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAFIVER · Etiquetas QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');
:root{
  --bg:#0c0c0c;--sf:#161616;--sf2:#1e1e1e;--bd:#2a2a2a;
  --ac:#c8a84b;--ac2:#a8882b;--red:#7a1515;--red2:#5a0f0f;
  --tx:#e8e3d9;--mt:#5a5a5a;--mt2:#888;
  --mono:"IBM Plex Mono",monospace;--sans:"IBM Plex Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);min-height:100vh}
header{background:linear-gradient(135deg,#111,#1a1a1a);border-bottom:1px solid var(--bd);padding:0 28px;height:64px;display:flex;align-items:center;gap:16px}
.hlogo{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--ac);flex-shrink:0}
.hlogo img{width:100%;height:100%;object-fit:cover}
.htitle{font-family:var(--mono);font-size:14px;letter-spacing:3px;color:var(--ac);font-weight:600}
.hsub{font-size:11px;color:var(--mt2);letter-spacing:1px;margin-top:2px}
.hbadge{margin-left:auto;background:linear-gradient(135deg,var(--red),var(--red2));color:#ffcdd2;font-family:var(--mono);font-size:9px;padding:5px 12px;border-radius:2px;letter-spacing:2px;text-transform:uppercase;border:1px solid #9a2525}
.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 64px)}
.sb{background:var(--sf);border-right:1px solid var(--bd);padding:20px 16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.sl{font-family:var(--mono);font-size:9px;letter-spacing:2.5px;color:var(--ac);text-transform:uppercase;margin-bottom:4px;padding-bottom:5px;border-bottom:1px solid var(--bd)}
.cg{display:flex;flex-direction:column;gap:4px}
.cg label{font-size:10px;color:var(--mt2);font-family:var(--mono);letter-spacing:.5px;text-transform:uppercase}
input{background:var(--sf2);border:1px solid var(--bd);border-radius:3px;color:var(--tx);font-family:var(--mono);font-size:13px;padding:8px 10px;width:100%;outline:none;transition:border-color .15s}
input:focus{border-color:var(--ac);background:#1a1700}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.tab{background:var(--sf2);border:1px solid var(--bd);color:var(--mt2);font-family:var(--mono);font-size:11px;padding:8px;border-radius:3px;cursor:pointer;letter-spacing:1px;transition:all .15s;text-align:center}
.tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;border-color:var(--ac);font-weight:700}
.panel{display:none;flex-direction:column;gap:9px}
.panel.on{display:flex}
.msg-ok{font-family:var(--mono);font-size:10px;color:#4caf50;min-height:13px;padding:2px 0}
.msg-warn{font-family:var(--mono);font-size:10px;color:#ef5350;min-height:13px;padding:2px 0}
.msg-info{font-family:var(--mono);font-size:10px;color:var(--ac);min-height:13px;padding:2px 0}
.frow{display:flex;gap:4px}
.frow input{flex:1}
.frow button{background:var(--sf2);border:1px solid var(--bd);color:var(--mt2);border-radius:3px;padding:0 9px;cursor:pointer;font-size:12px;transition:all .15s}
.frow button:hover{background:var(--ac);color:#000}
.cbadge{background:var(--ac);color:#000;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}
.rlist{max-height:200px;overflow-y:auto;border:1px solid var(--bd);border-radius:3px;background:var(--sf2)}
.ri{padding:7px 10px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .1s}
.ri:last-child{border-bottom:none}
.ri:hover{background:#222}
.ri.sel{background:#16130a;border-left:2px solid var(--ac)}
.ri input[type=checkbox]{accent-color:var(--ac);flex-shrink:0}
.rm{flex:1;min-width:0}
.ri-id{font-family:var(--mono);font-size:10px;color:var(--ac)}
.ri-nm{font-size:11px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-rt{font-size:10px;color:var(--mt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;border:none;border-radius:3px;padding:10px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1.5px;cursor:pointer;width:100%;transition:filter .15s;text-transform:uppercase}
.bp:hover{filter:brightness(1.1)}
.bp:disabled{filter:brightness(.4);cursor:not-allowed}
.bs{background:transparent;border:1px solid var(--bd);color:var(--mt2);border-radius:3px;padding:7px;font-family:var(--mono);font-size:10px;cursor:pointer;width:100%;transition:all .15s;text-transform:uppercase;letter-spacing:1px}
.bs:hover{border-color:var(--ac);color:var(--ac)}
.srow{display:flex;gap:4px}
.pv{padding:24px;overflow-y:auto;background:#0e0e0e}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.ph h2{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--ac);text-transform:uppercase}
.pc{display:flex;gap:6px}
.pc button{background:var(--sf);border:1px solid var(--bd);color:var(--tx);font-family:var(--mono);font-size:10px;padding:6px 12px;border-radius:3px;cursor:pointer;transition:all .15s;letter-spacing:1px}
.pc button:hover{border-color:var(--ac);color:var(--ac)}
.bpr{background:linear-gradient(135deg,var(--red),var(--red2))!important;border-color:var(--red)!important;color:#fff!important;font-weight:700}
#grid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.es{text-align:center;padding:80px 20px;color:var(--mt);font-family:var(--mono);font-size:11px;width:100%;letter-spacing:1px}
.es .ei{font-size:36px;margin-bottom:16px;opacity:.15}
.lw{position:relative}
.lw:hover .la{opacity:1}
.la{position:absolute;top:-8px;right:-8px;display:flex;gap:3px;opacity:0;transition:opacity .15s;z-index:10}
.la button{background:var(--red);border:1px solid #9a2525;color:#fff;font-size:9px;padding:3px 7px;border-radius:2px;cursor:pointer;font-family:var(--mono)}

/* ══════════════════════════════════
   ETIQUETA: 2.5cm × 5cm
   Preview 2×: 189px × 378px
   
   Layout:
   |←——— 165px ———→|← 24px →|
   |   ql-main      | ql-side |
   ══════════════════════════════════ */
.qlabel{
  width:189px;
  height:492px;
  background:#fff;
  border-radius:2px;
  display:flex;
  flex-direction:row;
  overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.7);
  border:1px solid #ddd;
}
.ql-main{
  width:165px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px 4px 8px 4px;
  background:#fff;
  overflow:hidden;
}
.ql-logo{
  width:130px;
  height:130px;
  border-radius:50%;
  overflow:hidden;
  flex-shrink:0;
  display:block;
}
.ql-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.ql-qr{
  margin-top:6px;
  flex-shrink:0;
  width:155px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.ql-qr canvas,.ql-qr img{
  display:block;
  max-width:155px;
  max-height:155px;
}
.ql-num{
  font-size:16px;
  font-family:"Courier New",monospace;
  color:#111;
  font-weight:700;
  letter-spacing:.5px;
  margin-top:6px;
  text-align:center;
  width:100%;
}
.ql-ruta{
  font-size:12px;
  font-weight:800;
  color:#7a1515;
  text-align:center;
  text-transform:uppercase;
  letter-spacing:.8px;
  margin-top:4px;
  line-height:1.3;
  padding:0 4px;
  word-break:break-word;
  width:100%;
}
.ql-side{
  flex:1;
  background:#7a1515;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:8px 0;
}
.ql-side span{
  display:block;
  writing-mode:vertical-rl;
  text-orientation:mixed;
  transform:rotate(180deg);
  font-family:"Arial Narrow",Arial,sans-serif;
  font-size:20px;
  font-weight:700;
  color:#fff;
  letter-spacing:2px;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-height:475px;
}

@media print{
  @page{margin:1.5mm;size:auto}
  body *{visibility:hidden}
  #parea,#parea *{visibility:visible}
  #parea{position:absolute;top:0;left:0;display:flex;flex-wrap:wrap;gap:1mm}
  .qlabel{width:25mm!important;height:65mm!important;box-shadow:none!important;page-break-inside:avoid}
  .ql-main{width:21mm!important;padding:1.5mm 1mm!important}
  .ql-logo{width:16mm!important;height:16mm!important}
  .ql-qr{width:19mm!important;margin-top:.8mm!important}
  .ql-qr canvas,.ql-qr img{max-width:19mm!important;max-height:19mm!important}
  .ql-num{font-size:7pt!important;margin-top:1mm!important}
  .ql-ruta{font-size:5.5pt!important;margin-top:.5mm!important}
  .ql-side{flex:none;width:4mm!important}
  .ql-side span{font-size:7pt!important;letter-spacing:1pt!important}
}
</style>
</head>

<div class="layout">
<aside class="sb">
  <div>
    <div class="sl">Modo de operación</div>
    <div class="tabs">
      <button class="tab on" id="t-ind" onclick="setMode('ind')">◎ Individual</button>
      <button class="tab" id="t-csv" onclick="setMode('csv')">⊞ CSV Masivo</button>
    </div>
  </div>

  <div class="panel on" id="p-ind">
    <div class="cg">
      <label>Número Destinatario</label>
      <input id="ind-num" placeholder="9000001525" oninput="buscar()">
    </div>
    <div id="ind-msg" class="msg-info">Escribe el número para buscar</div>
    <div class="cg">
      <label>Nombre Tienda</label>
      <input id="ind-tda" placeholder="AB MARELI">
    </div>
    <div class="cg">
      <label>Nombre Ruta</label>
      <input id="ind-ruta" placeholder="CORDOBA">
    </div>
    <div class="cg">
      <label>Copias</label>
      <input type="number" id="ind-cop" value="1" min="1" max="99">
    </div>
    <button class="bp" onclick="addInd()">+ Generar Etiqueta</button>
  </div>

  <div class="panel" id="p-csv">
    <div class="cg">
      <label>Fecha de Creación</label>
      <div class="frow">
        <input id="f-fecha" placeholder="20260301" oninput="doFilter()">
        <button onclick="cl('f-fecha')">✕</button>
      </div>
    </div>
    <div class="cg">
      <label>Ruta</label>
      <div class="frow">
        <input id="f-ruta" placeholder="ORIZABA o 7214" oninput="doFilter()">
        <button onclick="cl('f-ruta')">✕</button>
      </div>
    </div>
    <div class="cg">
      <label>Tienda</label>
      <div class="frow">
        <input id="f-tda" placeholder="LOLITA" oninput="doFilter()">
        <button onclick="cl('f-tda')">✕</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="font-family:var(--mono);font-size:10px;color:var(--mt2)">Filtrados:</span>
      <span class="cbadge" id="filt-cnt">0</span>
    </div>
    <div class="rlist" id="rec-list"></div>
    <div class="srow">
      <button class="bs" onclick="selAll()">☑ Todos</button>
      <button class="bs" onclick="selNone()">☐ Ninguno</button>
    </div>
    <div class="cg">
      <label>Copias por etiqueta</label>
      <input type="number" id="csv-cop" value="1" min="1" max="99">
    </div>
    <button class="bp" id="btn-add" disabled onclick="addSel()">+ Agregar Seleccionados</button>
  </div>

  <div style="border-top:1px solid var(--bd);padding-top:10px">
    <button class="bs" onclick="clearAll()">🗑 Limpiar todo</button>
  </div>
</aside>

<main class="pv">
  <div class="ph">
    <h2>Vista Previa de Etiquetas</h2>
    <div class="pc">
      <button onclick="clearAll()">✕ Limpiar</button>
      <button class="bpr" onclick="doPrint()">🖨 Imprimir</button>
    </div>
  </div>
  <div id="grid">
    <div class="es"><div class="ei">⬜</div>Las etiquetas aparecerán aquí.</div>
  </div>
</main>

let mode="ind",allRecs=[],filtRecs=[],queue=[];

function setMode(m){
  mode=m;
  ["ind","csv"].forEach(x=>{
    document.getElementById("t-"+x).classList.toggle("on",m===x);
    document.getElementById("p-"+x).classList.toggle("on",m===x);
  });
}

function autoLoad(){
  fetch("destnvo.csv?t="+Date.now())
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer();})
    .then(buf=>{parseCSV(new TextDecoder("iso-8859-1").decode(buf));})
    .catch(err=>{console.warn("CSV:",err.message);});
}

function ci(h,k){const i=h.findIndex(x=>x.trim().toUpperCase()===k);return i>=0?i:0;}
function parseCSV(txt){
  const lines=txt.split("\n").filter(l=>l.trim());
  if(lines.length<2)return;
  const h=lines[0].split(";");
  const CI=ci(h,"CLIENTE"),NI=ci(h,"NOMBRE"),PAI=ci(h,"PARVW"),
        INI=ci(h,"INTERLOCUTOR"),NNI=ci(h,"NOMBRE_INTERLOCUTOR"),FCI=ci(h,"FECHA_CREACION");
  allRecs=[];
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(";");
    if(c.length<7)continue;
    if((c[PAI]||"").trim()!=="WE")continue;
    const cliN=(c[CI]||"").trim().replace(/^0+/,"");
    const intN=(c[INI]||"").trim().replace(/^0+/,"");
    if(!intN||intN===cliN)continue;
    allRecs.push({cli:(c[CI]||"").trim(),nom:(c[NI]||"").trim(),
      int:(c[INI]||"").trim(),tda:(c[NNI]||"").trim(),fch:(c[FCI]||"").trim()});
  }
  doFilter();
  if(document.getElementById("ind-num").value.trim())buscar();
}

function cl(id){document.getElementById(id).value="";doFilter();}
function v(id){return(document.getElementById(id).value||"").trim();}
function doFilter(){
  const ff=v("f-fecha"),fr=v("f-ruta").toUpperCase(),ft=v("f-tda").toUpperCase();
  filtRecs=allRecs.filter(r=>
    (!ff||r.fch.includes(ff))&&
    (!fr||r.cli.includes(fr)||r.nom.toUpperCase().includes(fr))&&
    (!ft||r.tda.toUpperCase().includes(ft))
  );
  document.getElementById("filt-cnt").textContent=filtRecs.length;
  renderList();
  document.getElementById("btn-add").disabled=filtRecs.length===0;
}
function renderList(){
  const el=document.getElementById("rec-list");
  if(!filtRecs.length){el.innerHTML='<div style="padding:10px;text-align:center;font-size:11px;color:var(--mt2);font-family:var(--mono)">Sin resultados</div>';return;}
  el.innerHTML=filtRecs.slice(0,500).map((r,i)=>`
    <div class="ri" onclick="tog(${i})">
      <input type="checkbox" class="rcb" onclick="event.stopPropagation();tog(${i})">
      <div class="rm">
        <div class="ri-id">${esc(r.int)}</div>
        <div class="ri-nm">${esc(r.tda||"(sin nombre)")}</div>
        <div class="ri-rt">${esc(r.nom)} · ${esc(r.fch)}</div>
      </div>
    </div>`).join("");
}
function tog(i){const cbs=document.querySelectorAll(".rcb");const cb=cbs[i];if(!cb)return;cb.checked=!cb.checked;cb.closest(".ri").classList.toggle("sel",cb.checked);}
function selAll(){document.querySelectorAll(".rcb").forEach(cb=>{cb.checked=true;cb.closest(".ri").classList.add("sel");});}
function selNone(){document.querySelectorAll(".rcb").forEach(cb=>{cb.checked=false;cb.closest(".ri").classList.remove("sel");});}

function buscar(){
  const raw=v("ind-num");
  const msg=document.getElementById("ind-msg");
  document.getElementById("ind-tda").value="";
  document.getElementById("ind-ruta").value="";
  if(!raw){msg.textContent="Escribe el número para buscar";msg.className="msg-info";return;}
  if(!allRecs.length){msg.textContent="⏳ Cargando datos...";msg.className="msg-warn";return;}
  const num=raw.replace(/^0+/,"");
  const rec=allRecs.find(r=>r.int.replace(/^0+/,"")===num);
  if(rec){
    document.getElementById("ind-tda").value=rec.tda;
    document.getElementById("ind-ruta").value=rec.nom;
    msg.textContent="✓ "+rec.tda+" · "+rec.nom;
    msg.className="msg-ok";
  }else{
    msg.textContent="⚠ Número no encontrado";
    msg.className="msg-warn";
  }
}

function pad(s,n){return String(s||"").padStart(n,"0");}
function mkLabel(r){
  return{qrStr:pad(r.int,10),int:pad(r.int,10),tda:r.tda||"",ruta:r.nom||"",id:Math.random().toString(36).slice(2)};
}
function addInd(){
  const num=v("ind-num");
  if(!num){alert("Escribe el número de destinatario.");return;}
  const cop=parseInt(document.getElementById("ind-cop").value)||1;
  const rec=allRecs.find(r=>r.int.replace(/^0+/,"")===num.replace(/^0+/,""))||{int:num,tda:v("ind-tda"),nom:v("ind-ruta")};
  for(let c=0;c<cop;c++)queue.push(mkLabel(rec));
  render();
}
function addSel(){
  const cbs=document.querySelectorAll(".rcb");
  const cop=parseInt(v("csv-cop"))||1;
  let n=0;
  cbs.forEach((cb,i)=>{if(!cb.checked||!filtRecs[i])return;for(let c=0;c<cop;c++){queue.push(mkLabel(filtRecs[i]));n++;}});
  if(n)render();
}

function lblHTML(lb,qrId){
  return `<div class="ql-main">
    <div class="ql-logo"><img src="data:image/png;base64,${LOGO}" alt="CAFIVER"></div>
    <div class="ql-qr" id="${qrId}"></div>
    <div class="ql-num">${esc(lb.int)}</div>
    <div class="ql-ruta">${esc(lb.ruta)}</div>
  </div>
  <div class="ql-side"><span>${esc(lb.tda)}</span></div>`;
}

function render(){
  const g=document.getElementById("grid");
  if(!queue.length){g.innerHTML='<div class="es"><div class="ei">⬜</div>Las etiquetas aparecerán aquí.</div>';return;}
  g.innerHTML="";
  queue.forEach((lb,idx)=>{
    const qrId="qr-"+lb.id;
    const w=document.createElement("div");
    w.className="lw";
    w.innerHTML=`<div class="la"><button onclick="rmLbl(${idx})">✕ quitar</button></div><div class="qlabel">${lblHTML(lb,qrId)}</div>`;
    g.appendChild(w);
    setTimeout(()=>{
      const el=document.getElementById(qrId);
      if(el)new QRCode(el,{text:lb.qrStr,width:150,height:150,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M});
    },0);
  });
}
function rmLbl(i){queue.splice(i,1);render();}
function clearAll(){queue=[];render();}

async function doPrint(){
  if(!queue.length){alert("No hay etiquetas para imprimir.");return;}
  const pa=document.getElementById("parea");
  pa.innerHTML="";pa.style.cssText="display:flex;flex-wrap:wrap;gap:1mm;";
  const ps=queue.map(lb=>new Promise(res=>{
    const qrId="pqr-"+lb.id;
    const d=document.createElement("div");
    d.className="qlabel";
    d.innerHTML=lblHTML(lb,qrId);
    pa.appendChild(d);
    setTimeout(()=>{
      const el=document.getElementById(qrId);
      if(el)new QRCode(el,{text:lb.qrStr,width:180,height:180,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M});
      res();
    },25);
  }));
  await Promise.all(ps);
  setTimeout(()=>{window.print();pa.innerHTML="";pa.style.display="none";},700);
}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
autoLoad();
render();
</script>
</body>
</html>
